<div class="container">
  <div>
    <h2>Registro de Evaluación</h2>
  </div>
  <div>
    <form [formGroup]="form" (ngSubmit)="insertar()">
      <mat-form-field>
        <mat-label>Estudiante</mat-label>
        <mat-select formControlName="idEstudiante">
          @for (u of usuarios; track u.id) {
          <mat-option [value]="u.id">{{u.nombre}} {{u.apellido}}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <br>
      <mat-form-field class="example-full-width">
        <mat-label>Tipo de evaluación</mat-label>
        <input matInput type="text" formControlName="tipo">
      </mat-form-field>
      <br>
      <mat-form-field>
        <mat-label>Total de ejercicios</mat-label>
        <input matInput type="number" formControlName="totalEjercicios">
      </mat-form-field>
      <br>
      <mat-form-field>
        <mat-label>Fecha de inicio</mat-label>
        <input matInput type="datetime-local" formControlName="fechaInicio">
      </mat-form-field>
      <br>
      <mat-form-field>
        <mat-label>Estado</mat-label>
        <mat-select formControlName="estado">
          <mat-option [value]="'EN_CURSO'">EN_CURSO</mat-option>
          <mat-option [value]="'FINALIZADA'">FINALIZADA</mat-option>
        </mat-select>
      </mat-form-field>
      <br>
      <button matButton type="submit">Registrar</button>

    </form>
    @if(mensaje){
    <p>{{mensaje}}</p>
    }
  </div>
</div>
