<div class="container">
  <div>
    <h2>Formulario de Actualización de Evaluaciones</h2>
  </div>
  <div>
    <form [formGroup]="form" (ngSubmit)="actualizar()">
      <mat-form-field class="example-full-width">
        <mat-label>ID</mat-label>
        <input matInput formControlName="codigo" readonly>
      </mat-form-field>
      <br>
      <mat-form-field>
        <mat-label>Estudiante</mat-label>
        <mat-select formControlName="idEstudiante">
          @for (u of usuarios; track u.id) {
          <mat-option [value]="u.id">{{u.nombre}} {{u.apellido}}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <br>
      <mat-form-field>
        <mat-label>Estado</mat-label>
        <mat-select formControlName="estado">
          <mat-option [value]="'EN_CURSO'">EN_CURSO</mat-option>
          <mat-option [value]="'FINALIZADA'">FINALIZADA</mat-option>
        </mat-select>
      </mat-form-field>
      <br>
      <mat-form-field>
        <mat-label>Actualizado por</mat-label>
        <mat-select formControlName="idActualizadoPor">
          @for (u of usuarios; track u.id) {
          <mat-option [value]="u.id">{{u.nombre}} {{u.apellido}}</mat-option>
          }
        </mat-select>
      </mat-form-field>
      <br>
      <button matButton type="submit">Guardar</button>

    </form>
    @if(mensaje){
    <p>{{mensaje}}</p>
    }
  </div>
</div>
