<div class="container">
  <h2>Lista de Evaluaciones por Estudiante</h2>
  <div>
    @if(dataSource.length>0){
    <!--Tabla de angular material-->
    <table mat-table [dataSource]="dataSource" class="mat-shadow-2">

      <ng-container matColumnDef="C1">
        <th mat-header-cell *matHeaderCellDef>Estudiante</th>
        <td mat-cell *matCellDef="let element">{{ element.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="C2">
        <th mat-header-cell *matHeaderCellDef>Evaluaciones</th>
        <td mat-cell *matCellDef="let element">{{ element.cantidad }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    }@else if(!mensaje){
    <p>No hay estudiantes con evaluaciones disponibles.</p>
    }
    @if(mensaje){
    <p>{{mensaje}}</p>
    }
  </div>
</div>
