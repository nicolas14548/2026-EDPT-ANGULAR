<div class="container">
  <h2>Lista de Ejercicios</h2>
  <div>
    @if(dataSource.length>0){
    <!--Tabla de angular material-->
    <table mat-table [dataSource]="dataSource" class="mat-shadow-2">

      <ng-container matColumnDef="C1">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let element">{{ element.id }}</td>
      </ng-container>

      <ng-container matColumnDef="C2">
        <th mat-header-cell *matHeaderCellDef>Tema</th>
        <td mat-cell *matCellDef="let element">{{ element.tema }}</td>
      </ng-container>

      <ng-container matColumnDef="C3">
        <th mat-header-cell *matHeaderCellDef>Enunciado</th>
        <td mat-cell *matCellDef="let element">{{ element.enunciado }}</td>
      </ng-container>

      <ng-container matColumnDef="C4">
        <th mat-header-cell *matHeaderCellDef>Dificultad</th>
        <td mat-cell *matCellDef="let element">{{ element.nivelDificultad }}</td>
      </ng-container>

      <ng-container matColumnDef="C5">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let element">{{ element.estado }}</td>
      </ng-container>

      <ng-container matColumnDef="C6">
        <th mat-header-cell *matHeaderCellDef>Eliminar</th>
        <td mat-cell *matCellDef="let element">

          <button mat-icon-button class="a" (click)="eliminar(element.id)">
            <mat-icon>delete</mat-icon>
          </button>

        </td>
      </ng-container>
      <ng-container matColumnDef="C7">
        <th mat-header-cell *matHeaderCellDef>Editar</th>

        <td mat-cell *matCellDef="let element">

          <button mat-button  class="a" [routerLink]="['/ejercicio/editar', element.id]">
            <mat-icon>edit</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    }@else {
    <p>No hay ejercicios disponibles.</p>
    }
    @if(mensaje){
    <p>{{mensaje}}</p>
    }
  </div>
</div>
