<div class="container">
  <div>
    <h2>Formulario de Actualización de Roles</h2>
  </div>
  <div>
    <form [formGroup]="form" (ngSubmit)="actualizar()">
      <mat-form-field class="example-full-width">
        <mat-label>ID</mat-label>
        <input matInput formControlName="codigo" readonly>
      </mat-form-field>
      <br>
      <mat-form-field class="example-full-width">
        <mat-label>Nombre del Rol</mat-label>
        <input matInput type="text" placeholder="DOCENTE" formControlName="nombre">
      </mat-form-field>
      <br>
      <mat-form-field class="example-full-width">
        <mat-label>Descripción</mat-label>
        <input matInput type="text" placeholder="Docente de la institución" formControlName="descripcion">
      </mat-form-field>
      <br>
      <button matButton type="submit">Guardar</button>

    </form>
    @if(mensaje){
    <p>{{mensaje}}</p>
    }
  </div>
</div>
